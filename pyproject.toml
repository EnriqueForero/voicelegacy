[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voicelegacy"
version = "0.7.1"
description = "Voice cloning pipeline for family legacy — XTTS-v2 + speakerscribe integration, optimized for Google Colab Free Tier (T4 GPU). Builds curated reference corpora from diarized interviews and synthesizes new speech in the target speaker's voice."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Néstor Enrique Forero Herrera", email = "enrique.economista@gmail.com"},
]

keywords = ["tts", "voice-cloning", "xtts", "coqui", "legacy", "family-archive", "speech-synthesis", "ai", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "coqui-tts>=0.27.0,<1.0",
    "librosa>=0.10,<1.0",
    "soundfile>=0.12,<1.0",
    "noisereduce>=3.0,<4.0",
    "pyloudnorm>=0.1,<1.0",
    "pydantic>=2.5,<3.0",
    "loguru>=0.7,<1.0",
    "typer>=0.12,<1.0",
    "rich>=13.7,<15.0",
]

[project.optional-dependencies]
# Tooling for contributors and CI. pre-commit + nbformat are required so the
# CI quality gate can actually run the local hooks and notebook-schema check
# (previously nbformat was imported by scripts/check_notebook_schema.py but
# never installed, so that CI step would crash).
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff==0.15.16",
    "mypy>=1.10",
    "pre-commit>=3.7,<5.0",
    "nbformat>=5.10",
]
# Speaker-similarity validation (Resemblyzer voice encoder). Imported lazily in
# voicelegacy/similarity.py and voicelegacy/finetune_dataset.py.
similarity = ["resemblyzer"]
# Fine-tuning dataset builder: word-level timestamps via faster-whisper.
finetune = ["faster-whisper>=1.0,<2.0"]
# Optional DeepFilterNet denoiser, invoked as the `deepFilter` CLI by
# voicelegacy/denoise_eval.py. Version floor is provisional and should be
# pinned exactly once validated on the target Colab T4 image.
deepfilter = ["deepfilternet>=0.5"]
# Evaluation harness (voicelegacy.evaluation). All of these are imported lazily
# and degrade to "skipped" if absent, so they are intentionally NOT in the base
# install. Version floors are provisional and should be pinned exactly once
# validated on the target Colab T4 image: speechbrain (ECAPA SECS), torchaudio
# (SQUIM MOS proxy, SQUIM_OBJECTIVE needs >=2.1), faster-whisper (WER ASR),
# num2words (Spanish number normalization for WER), pandas+pyarrow (cumulative
# parquet; without them the harness falls back to JSONL).
eval = [
    "speechbrain>=1.0",
    "torchaudio>=2.1",
    "faster-whisper>=1.0,<2.0",
    "num2words>=0.5",
    "pandas>=2.0",
    "pyarrow>=14.0",
]
# Convenience meta-extra. Self-referential (PEP 621) to stay DRY: `all` always
# equals the union of the feature extras with no duplicated version specifiers.
all = ["voicelegacy[similarity,finetune,deepfilter,eval]"]

[project.urls]
Homepage      = "https://github.com/EnriqueForero/voicelegacy"
Repository    = "https://github.com/EnriqueForero/voicelegacy"
"Bug Tracker" = "https://github.com/EnriqueForero/voicelegacy/issues"
Documentation = "https://github.com/EnriqueForero/voicelegacy"
Changelog     = "https://github.com/EnriqueForero/voicelegacy/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where   = ["."]
include = ["voicelegacy*"]
exclude = ["tests*", "notebooks*", "docs*"]

[tool.setuptools.package-data]
# py.typed marks the package as typed (PEP 561). data/*.txt ships the golden
# stimulus set so `voicelegacy benchmark` finds its default corpus when
# installed as a wheel (importlib.resources reads it from the package).
"voicelegacy" = ["py.typed", "data/*.txt"]


# ═══════════════════════════════════════════════════════════
# Pytest
# ═══════════════════════════════════════════════════════════
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py"]
addopts      = "-v --tb=short --strict-markers --cov=voicelegacy --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
markers = [
    "paridad: test de paridad binaria contra valores congelados",
    "canario: test canario con datos externos (requiere variable de entorno)",
    "smoke: test rapido end-to-end sobre golden_set.parquet",
]


# ═══════════════════════════════════════════════════════════
# Coverage.py
# ═══════════════════════════════════════════════════════════
[tool.coverage.run]
branch = true
source = ["voicelegacy"]
omit = [
    "*/tests/*",
    "*/dashboard.py",
    "*/visualizacion*.py",
    "*/visualizacion_interactiva.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
precision    = 1
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
    "def __str__",
]


# ═══════════════════════════════════════════════════════════
# Ruff (linter + formatter)
# ═══════════════════════════════════════════════════════════
[tool.ruff]
line-length    = 100
target-version = "py310"
# Generated notebooks are validated against the nbformat schema (see
# scripts/check_notebook_schema.py), not linted as source. Their Python cells
# are emitted by the notebooks/build_*.py generators, which ARE linted.
extend-exclude = ["notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "N806",
    "SIM108",
    "UP007",
    "UP045",
    "RUF001",
    "RUF002",
    "RUF003",
    "N817",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"__init__.py" = ["F401"]
"tests/*" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["voicelegacy"]

[tool.ruff.format]
quote-style  = "double"
indent-style = "space"
