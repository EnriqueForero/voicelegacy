name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-quality:
    name: Python ${{ matrix.python-version }} quality gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # Fail fast on a broken pyproject BEFORE any install attempt. A malformed
      # TOML makes `pip install -e` crash with a confusing TOMLDecodeError; this
      # gives a clear signal first. (Was previously placed AFTER the install,
      # where it could never run because the install had already failed.)
      - name: Validate pyproject.toml parses
        run: python scripts/check_pyproject_toml.py pyproject.toml

      - name: Install CPU-only torch for lightweight test imports
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Run every pre-commit hook in CI so the local guards (pyproject TOML
      # validity, notebook schema, no live runtime.unassign()) are actually
      # enforced and not merely declared. This is the single source of truth
      # for lint + format (ruff-check / ruff-format) — no duplicated ruff steps.
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      # The generators are the source of truth for the notebooks; regenerate
      # them and re-validate the fresh output (pre-commit only checks the
      # committed copies, it does not run the build_*.py generators).
      - name: Regenerate and validate notebooks
        run: |
          for gen in notebooks/build_notebook.py \
                     notebooks/build_finetune_notebook.py \
                     notebooks/build_finetune_standalone_notebook.py \
                     notebooks/build_bridge_notebook.py; do
            echo "=== $gen ==="
            python "$gen"
          done
          for nb in notebooks/*.ipynb; do
            python scripts/check_notebook_schema.py "$nb"
            python scripts/check_no_runtime_unassign.py "$nb"
          done

      - name: Test with coverage
        run: python -m pytest -q
